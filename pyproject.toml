[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrgaugury"
version = "0.2.1"
description = "Genome-wide prediction of plant resistance gene analogs (a Python re-implementation of RGAugury)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["numpy>=1.22", "pyhmmer>=0.10"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
pyrgaugury = "pyrgaugury.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
